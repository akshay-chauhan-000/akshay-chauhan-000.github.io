  profileMode:
    enabled: true
    title: Akshay Chauhan
    role: "Computational Polymer Physics · PhD scholar, IISER Pune"
    subtitle: >
      I study how long-chain molecules fold, assemble, and travel through
      environments as crowded as the inside of a living cell — using
      coarse-grained simulations, statistical mechanics, and models kept
      deliberately minimal. Alongside the PhD, I design and review the
      physics problems used to train and evaluate frontier AI models.
    imageUrl: "/picture.jpeg"
    imageWidth: 150
    imageHeight: 150
    cards:
      - name: Publications
        desc: "Peer-reviewed work on polymer topology, electrostatic self-assembly, and transport through nanopores under crowding."
        url: /publications/
      - name: Interactive Simulations
        desc: "Physics you can push around, right in the browser — active-matter particle life and pathfinding on energy landscapes."
        url: /simulations/
        badge: New
      - name: About
        desc: "Background, methods, skills, and what I do beyond the university."
        url: /about/
